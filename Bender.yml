package:
  name: croc_soc
  authors:
    - "Philippe Sauter <phsauter@iis.ee.ethz.ch>"

dependencies:
  common_cells:         { git: "https://github.com/pulp-platform/common_cells.git",        version: 1.39.0 }
  common_verification:  { git: "https://github.com/pulp-platform/common_verification.git", version: 0.2.5  } # rev 5fd30c1 conflicts with transitive ^0.2 ranges
  riscv-dbg:
    git: "https://github.com/pulp-platform/riscv-dbg.git"
    rev: "verilator-phsauter"
    pass_targets:
      - { target: basys3, pass: bscane }
  tech_cells_generic:   { git: "https://github.com/pulp-platform/tech_cells_generic.git",  version: 0.2.14 }
  apb:                  { git: "https://github.com/pulp-platform/apb.git",                 version: 0.2.4  }
  obi:                  { git: "https://github.com/pulp-platform/obi.git",                 version: 0.1.7  } # rev 6a724da (obi_to_apb) conflicts with transitive ^0.1 ranges; unused by croc
  obi_peripherals:      { git: "https://github.com/pulp-platform/obi_peripherals.git",     rev: 21ee04d    } # UART
  idma:                 { git: "https://github.com/pulp-platform/iDMA.git",                version: 0.6.5  } # croc adds rw_obi backend in rtl/idma
  axi:                  { git: "https://github.com/pulp-platform/axi.git",                 version: 0.39.1 } # rtl/idma/idma_rw_obi.sv includes axi/typedef.svh
  cve2:                 { path: "rtl/cve2" } # vendored: upstream CVE2 has no Bender.yml

sources:
  # Level 0
  - target: ihp13
    files:
      - ihp13/tc_clk.sv
      - ihp13/tc_sram_impl.sv

  - rtl/croc_pkg.sv
  - rtl/user_pkg.sv
  - rtl/soc_ctrl/soc_ctrl_regs_pkg.sv
  - rtl/gpio/gpio_reg_pkg.sv
  - rtl/clint/clint_reg_pkg.sv
  - rtl/obi_timer/obi_timer_reg_pkg.sv
  # add your design files containing anything but modules (packages) here

  # RTL
  - target: not(netlist_yosys)
    files:
      # Level 1
      - rtl/idma/idma_rw_obi.sv
      - rtl/croc_idma.sv
      - rtl/core_wrap.sv
      - rtl/bootrom/croc_bootrom.sv
      - rtl/soc_ctrl/soc_ctrl_regs.sv
      - rtl/gpio/gpio_reg_top.sv
      - rtl/gpio/gpio.sv
      - rtl/clint/clint.sv
      - rtl/obi_timer/obi_timer.sv
      # Level 2
      - rtl/croc_domain.sv
      - rtl/user_domain.sv
      # add your design files with modules here
      # Level 3
      - rtl/croc_soc.sv

  - target: all(not(fpga), not(netlist_yosys))
    files:
      # Level 0
      - rtl/croc_chip.sv

  # netlist for simulation
  - target: netlist_yosys
    files:
      - yosys/out/netlist_debug.v

  - target: any(simulation, verilator)
    files:
      - rtl/test/tb_croc_pkg.sv
      - rtl/test/croc_vip.sv
      - rtl/test/tb_croc_soc.sv

  - target: any(genesys2, basys3)
    files:
      - xilinx/hw/croc_xilinx.sv
      - xilinx/hw/fan_ctrl.sv

vendor_package:
  - name: cve2
    target_dir: rtl/cve2
    upstream: { git: "https://github.com/openhwgroup/cve2.git", rev: "53076d64c97685b1d2f5d07cd7f5cc439cf1f351" }
    patch_dir: "rtl/.patches/cve2"
    mapping:
      - { from: 'rtl/',                                            to: '',                 patch_dir: 'rtl/' }
      - { from: 'README.md',                                       to: 'README.md',        patch_dir: '' }
      - { from: 'doc/03_reference/images/blockdiagram.drawio.svg', to: 'blockdiagram.svg', patch_dir: '' }
