name: ArtistIC Render

on:
    workflow_dispatch:
      inputs:
        run_id:
          description: Full Flow run containing the GDS and OpenROAD artifacts
          required: true
          type: string
    workflow_run:
      workflows: ["Full Flow"]
      types: [completed]
      branches: [main]

jobs:
  artistic:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      # Check out croc repo and cleanup
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free disk space
        uses: ./.github/actions/free-space
      # Restore previous artifacts (GDS and DEF)
      - name: Download GDS artifact from "Full Flow" workflow
        uses: actions/download-artifact@v4
        with:
          name: croc-gds-sealed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          path: klayout/out
      - name: Download DEF artifact from "Full Flow" workflow
        uses: actions/download-artifact@v4
        with:
          name: croc-openroad-out
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          path: openroad

      - name: Generate logo, render, outlines and map
        uses: ./.github/actions/oseda-cmd
        with:
          setup_cmd: |
            apt-get update
            apt-get install -y --no-install-recommends inkscape potrace python3-img2pdf
          cmd: "source env.sh; make -C artistic/artistic PROJECT=../croc.toml all"

      # Upload artifacts
      - name: Upload ArtistIC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: croc-artistic
          path: |
            artistic/work/croc_chip.gds.gz
            artistic/work/croc_logo.*
            artistic/work/croc_logo_geometry.svg
            artistic/work/logo_merge.json
            artistic/work/logo_prepare.json
            artistic/work/croc_palette.svg
            artistic/work/croc_modules.*
            artistic/work/croc_render.*
            artistic/work/croc_poster.pdf
            artistic/work/manifest.json

      # Deploy
      - name: Copy files to be deployed
        run: |
          cp openroad/reports/04_croc.routed.png artistic/work/map/croc_routed.png
          cp artistic/work/croc_logo.gds artistic/work/map/croc_logo.gds
          cp artistic/work/croc_modules.jpg artistic/work/map/croc_modules.jpg
          cp artistic/work/croc_render.jpg artistic/work/map/croc_render.jpg
      - name: Upload OpenStreetMap DB to pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: artistic/work/map
      - name: Deploy pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
