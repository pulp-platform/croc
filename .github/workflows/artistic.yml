name: ArtistIC Render

on:
    workflow_dispatch:
      inputs:
        run_id:
          description: Full Flow run containing the GDS and OpenROAD artifacts
          required: true
          type: string
    workflow_run:
      workflows: ["Full Flow"]
      types: [completed]
      branches: [main]

jobs:
  artistic:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 60
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      # Check out croc repo and cleanup
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free disk space
        uses: ./.github/actions/free-space
      # Restore previous artifacts (GDS and DEF)
      - name: Download GDS artifact from "Full Flow" workflow
        uses: actions/download-artifact@v4
        with:
          name: croc-gds-sealed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          path: klayout/out
      - name: Download DEF artifact from "Full Flow" workflow
        uses: actions/download-artifact@v4
        with:
          name: croc-openroad-out
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          path: openroad

      # Install dependencies
      - name: Install host image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape imagemagick potrace
          pip install --break-system-packages svgpathtools Pillow

      # Logo
      - name: Prepare logo
        run: make -C artistic/artistic PROJECT=../croc.toml logo-prepare
      - name: Merge logo into GDS
        uses: ./.github/actions/oseda-cmd
        with:
          cmd: "source env.sh; make -C artistic/artistic PROJECT=../croc.toml logo-merge"

      # Render
      - name: Generate render layer images
        uses: ./.github/actions/oseda-cmd
        with:
          cmd: "source env.sh; make -C artistic/artistic PROJECT=../croc.toml render-generate"
      - name: Compose render
        run: make -C artistic/artistic PROJECT=../croc.toml render-compose

      # Optional module annotation
      - name: Create annotated render
        run: |
          source env.sh
          python3 artistic/artistic/scripts/gen_outline.py \
            -i "openroad/out/${PROJ_NAME}.def" \
            -o artistic/work/croc_modules.svg \
            -b artistic/work/croc_render.jpg \
            --lef_files "${PDK_DIR_LEF_SRAMS}/*.lef" \
            --px_scale 15000 \
            --module_json artistic/src/croc_modules.json \
            --opacity 0.65 \
            --font_size 35 \
            --luminosity 0.85 \
            --scale 2.0
          inkscape artistic/work/croc_modules.svg -o artistic/work/croc_modules.png
          inkscape artistic/work/croc_modules.svg -o artistic/work/croc_modules.pdf
          convert artistic/work/croc_modules.png artistic/work/croc_modules.jpg

      # Map
      - name: Generate map layer images
        uses: ./.github/actions/oseda-cmd
        with:
          cmd: "source env.sh; make -C artistic/artistic PROJECT=../croc.toml map-generate"
      - name: Build map
        run: make -C artistic/artistic PROJECT=../croc.toml map-build

      # Upload artifacts
      - name: Upload ArtistIC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: croc-artistic
          path: |
            artistic/work/croc_chip.gds.gz
            artistic/work/croc_logo.*
            artistic/work/croc_modules.*
            artistic/work/croc_render.*
            artistic/work/manifest.json

      # Deploy
      - name: Copy files to be deployed
        run: |
          cp openroad/reports/04_croc.routed.png artistic/work/map/croc_routed.png
          cp artistic/work/croc_logo.gds artistic/work/map/croc_logo.gds
          cp artistic/work/croc_modules.jpg artistic/work/map/croc_modules.jpg
          cp artistic/work/croc_render.jpg artistic/work/map/croc_render.jpg
      - name: Upload OpenStreetMap DB to pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: artistic/work/map
      - name: Deploy pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
