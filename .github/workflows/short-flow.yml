name: Short Flow

on:
  push:
    branches:
      - '**'

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk space
        uses: ./.github/actions/free-space
      - name: Run simulation flow in OSEDA
        uses: ./.github/actions/oseda-cmd
        with:
          cmd: ".github/scripts/run_sim_flow.sh --rtl"
      - name: Upload built software
        uses: actions/upload-artifact@v4
        with:
          name: croc-sw
          path: sw/bin
      - name: Upload simulation output
        uses: actions/upload-artifact@v4
        with:
          name: simulation-output
          path: |
            verilator/croc.fst
            verilator/croc_rtl.log
      - name: Upload test logs
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: verilator/test_*.log

  synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk space
        uses: ./.github/actions/free-space
      - name: Run synthesis flow in OSEDA
        uses: ./.github/actions/oseda-cmd
        with:
          cmd: ".github/scripts/run_synth_flow.sh"
      - name: Upload synthesis outputs
        uses: actions/upload-artifact@v4
        with:
          name: croc-synth-reports
          path: |
            yosys/reports
            yosys/out

  netlist-simulation:
    needs: [simulation, synthesis]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk space
        uses: ./.github/actions/free-space
      - name: Download built software
        uses: actions/download-artifact@v4
        with:
          name: croc-sw
          path: sw/bin
      - name: Download synthesis outputs
        uses: actions/download-artifact@v4
        with:
          name: croc-synth-reports
          path: yosys
      - name: Run CMOS5L netlist simulation suite in OSEDA
        uses: ./.github/actions/oseda-cmd
        with:
          cmd: ".github/scripts/run_sim_flow.sh --netlist"
      - name: Upload netlist simulation logs
        uses: actions/upload-artifact@v4
        with:
          name: netlist-simulation-logs
          path: |
            verilator/croc_netlist_yosys.log
            verilator/test_*.log
